{% extends 'base.html' %}
{% block title %}Log In - SurplusShare{% endblock %}
{% block content %}
    <div style="max-width: 500px; margin: 40px auto;">
        <h1 style="text-align: center;">Welcome Back! 👋</h1>
        <div style="background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #ccc;">
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" style="width: 100%; background: #2e8b57; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px;">Log In</button>
            </form>
        </div>
    </div>
{% endblock %}
